<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador Personal</title>
<style>
:root {
  --bg: #0E1117;
  --surface: #161B26;
  --raised: #1E2535;
  --line: rgba(255,255,255,0.08);
  --text: #F2F4F8;
  --muted: #8C97AB;
  --lavender: #BDA6FF;
  --mint: #8ED6B4;
  --peach: #FFB88C;
  --sky: #7FCBD7;
  --pink: #F59EB7;
  --gold: #E2CE83;
}
body.light-theme {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --raised: #EBF0F7;
  --line: rgba(15,23,42,0.10);
  --text: #141923;
  --muted: #616E82;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
input, textarea, select { user-select: text; font-family: inherit; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
}
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(140,151,171,0.25); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(140,151,171,0.45); }

/* Layout */
.sidebar {
  width: 245px;
  min-width: 245px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  transition: margin-left 0.22s ease, opacity 0.22s ease;
  z-index: 20;
}
.sidebar.collapsed {
  margin-left: -245px;
  opacity: 0;
  pointer-events: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 8px 22px;
}
.brand-icon {
  width: 36px; height: 36px;
  border-radius: 11px;
  background: var(--lavender);
  color: #0E1117;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 18px;
}
.brand-text {
  font-size: 11px; font-weight: 800; letter-spacing: 1.5px; line-height: 1.25;
}
.nav-section-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
  color: var(--muted); padding: 0 10px 10px;
}
.nav-btn {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 11px 13px;
  border: none; background: transparent; color: var(--muted);
  font-size: 13.5px; font-weight: 600;
  border-radius: 12px; cursor: pointer; text-align: left;
  transition: all 0.15s; margin-bottom: 4px;
}
.nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-btn.active {
  background: var(--raised);
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(189,166,255,0.22);
}
.nav-btn .ico { width: 20px; text-align: center; font-size: 15px; }
.sidebar-footer {
  margin-top: auto;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px;
}
.sidebar-footer .day { font-size: 13px; font-weight: 700; color: var(--text); text-transform: capitalize; }
.sidebar-footer .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  gap: 14px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: 0.15s;
}
.icon-btn:hover { background: var(--raised); border-color: var(--lavender); }
.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 30px 60px;
}

/* Reusable UI */
.surface {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 20px;
  margin-bottom: 18px;
}
.surface-raised {
  background: linear-gradient(135deg, var(--raised), var(--surface));
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 20px;
}
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
@media (max-width: 1100px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 780px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }
.h2 { font-size: 18px; font-weight: 750; }
.sub { font-size: 12px; color: var(--muted); }
.label-caps {
  font-size: 9.5px; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--muted);
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: 99px;
  border: 1px solid transparent;
  font-size: 12px; font-weight: 700;
  cursor: pointer; transition: 0.15s;
  background: var(--raised); color: var(--text);
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-lavender { background: var(--lavender); color: #0E1117; }
.btn-mint { background: var(--mint); color: #0E1117; }
.btn-peach { background: var(--peach); color: #0E1117; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--lavender); }
.btn-sm { padding: 6px 11px; font-size: 11px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 99px;
  font-size: 11px; font-weight: 700;
  background: rgba(189,166,255,0.14); color: var(--lavender);
}
.pill-mint { background: rgba(142,214,180,0.14); color: var(--mint); }
.pill-peach { background: rgba(255,184,140,0.14); color: var(--peach); }
.pill-sky { background: rgba(127,203,215,0.14); color: var(--sky); }

.seg-bar {
  display: inline-flex; background: var(--surface);
  padding: 5px; border-radius: 99px; border: 1px solid var(--line);
  gap: 4px; flex-wrap: wrap;
}
.seg-btn {
  padding: 8px 16px; border-radius: 99px; border: none;
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.15s;
}
.seg-btn.active { background: var(--lavender); color: #0E1117; }

.filter-pill {
  padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--raised); color: var(--muted);
  font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.14s;
}
.filter-pill:hover { color: var(--text); }
.filter-pill.active {
  background: var(--lavender); color: #0E1117; border-color: var(--lavender);
}
.filter-pill.active-mint {
  background: var(--mint); color: #0E1117; border-color: var(--mint);
}
.filter-pill.active-peach {
  background: var(--peach); color: #0E1117; border-color: var(--peach);
}

.badge-ico {
  width: 36px; height: 36px; border-radius: 11px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}

.progress-track {
  width: 100%; height: 7px; border-radius: 99px;
  background: rgba(255,255,255,0.07); overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 99px; transition: width 0.25s ease;
}

/* Tables & Rows */
.item-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(30,37,53,0.5);
  border: 1px solid var(--line);
  margin-bottom: 8px; transition: 0.14s;
}
.item-row:hover { border-color: rgba(189,166,255,0.35); background: rgba(30,37,53,0.85); }

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(6,8,12,0.72);
  backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal-card {
  width: 100%; max-width: 560px; max-height: 90vh;
  background: var(--surface);
  border: 1px solid rgba(189,166,255,0.3);
  border-radius: 22px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.modal-header {
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-body {
  padding: 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
}
.modal-footer {
  padding: 15px 22px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: 10px;
}
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-group label { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; padding: 10px 13px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--raised);
  color: var(--text); font-size: 13.5px; outline: none;
}
.input:focus { border-color: var(--lavender); }

/* Floating Hover Dialogs for Charts */
.chart-dialog {
  background: var(--bg);
  border: 1px solid rgba(189,166,255,0.45);
  border-radius: 15px;
  padding: 13px 15px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  margin-top: 10px;
}
.bar-col {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  height: 210px; cursor: pointer; position: relative; padding: 0 12px;
}
.bar-rect {
  width: 100%; max-width: 110px; border-radius: 12px 12px 5px 5px;
  transition: all 0.18s ease;
}
.bar-col:hover .bar-rect, .bar-col.hovered .bar-rect {
  filter: brightness(1.18) drop-shadow(0 0 14px var(--glow-color, rgba(142,214,180,0.65)));
  transform: scaleX(1.04);
}
.bar-top-val {
  font-size: 12px; font-weight: 800; padding: 3px 8px;
  border-radius: 7px; background: var(--raised);
  border: 1px solid var(--line); margin-bottom: 6px; white-space: nowrap;
}

/* Heatmap cells */
.heat-grid {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;
}
.heat-cell {
  height: 44px; border-radius: 10px; padding: 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; border: 1px solid var(--line); transition: 0.14s;
}
.heat-cell:hover, .heat-cell.active {
  transform: scale(1.06);
  border-color: var(--peach) !important;
  box-shadow: 0 0 12px rgba(255,184,140,0.45);
}
.save-indicator {
  font-size: 11px; color: var(--mint); font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-icon">☰</div>
    <div class="brand-text">PLANIFICADOR<br>PERSONAL</div>
  </div>
  <div class="nav-section-label">TU ESPACIO</div>
  <button class="nav-btn" data-page="Inicio" onclick="setPage('Inicio')"><span class="ico">⊞</span> Inicio</button>
  <button class="nav-btn" data-page="Agenda" onclick="setPage('Agenda')"><span class="ico">📅</span> Agenda</button>

  <button class="nav-btn" data-page="Metas" onclick="setPage('Metas')"><span class="ico">🎯</span> Metas</button>
  <button class="nav-btn active" data-page="Finanzas" onclick="setPage('Finanzas')"><span class="ico">◔</span> Finanzas</button>

<!-- MAIN CONTENT -->
<div class="main-wrap">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar()" title="Mostrar / ocultar barra lateral">☰</button>
      <div>
        <div style="font-size:15px;font-weight:800;" id="topbar-title">Finanzas</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-header">
      <div class="h2" id="modal-title">Editar</div>
      <button class="icon-btn" style="width:30px;height:30px;" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script id="initial-seed" type="application/json">__INITIAL_SEED_JSON__</script>
<script>
const APPLE_EPOCH_OFFSET = 978307200; // Seconds between 1970-01-01 and 2001-01-01

function toDate(val) {
  if (val === null || val === undefined) return new Date();
  if (val instanceof Date) return val;
  if (typeof val === 'number') {
    // Heuristic: Apple reference dates around 2020-2035 are ~600M to 1.1B seconds
    if (val < 1600000000) return new Date((val + APPLE_EPOCH_OFFSET) * 1000);
    if (val < 10000000000) return new Date(val * 1000);
    return new Date(val);
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? new Date() : d;
}

function toAppleTimestamp(dateInput) {
  const d = toDate(dateInput);
  return (d.getTime() / 1000) - APPLE_EPOCH_OFFSET;
}

function toInputDate(val) {
  const d = toDate(val);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function fromInputDate(str) {
  if (!str) return toAppleTimestamp(new Date());
  const [y, m, d] = str.split('-').map(Number);
  return toAppleTimestamp(new Date(y, m - 1, d, 12, 0, 0));
}

function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID().toUpperCase();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
  });
}

// App State
let state = {
  page: 'Finanzas',
  finTab: 'Dashboard', // Dashboard, Movimientos, Cajas y deudas
  finCatalog: 'Movimientos', // Movimientos, Pagos fijos, Categorías
  monthCursor: new Date(),
  // Dashboard chart filters
  cashFlowPeriod: 'Mes actual',
  cashFlowStart: toInputDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1)),
  cashFlowEnd: toInputDate(new Date()),
  cashFlowHover: null, // 'income' | 'expense' | null

  catPeriod: 'Mes actual',
  catStart: toInputDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1)),
  catEnd: toInputDate(new Date()),
  catHoverID: null,

  heatPeriod: 'Mes actual',
  heatMode: 'calendar', // 'calendar' | 'weekday'
  heatStart: toInputDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1)),
  heatEnd: toInputDate(new Date()),
  heatHoverDay: null,
  heatHoverWeekday: null,

  // Movimientos filters
  movPeriod: 'Todo',
  movStart: toInputDate(new Date(new Date().getFullYear(), new Date().getMonth(), 1)),
  movEnd: toInputDate(new Date()),
  movKind: 'Todos', // Todos, Gasto, Ingreso
  movCategoryID: 'ALL',
  movSearch: '',

  // Pagos fijos filters & selection
  fpScopeFilter: 'ALL', // ALL, Personal, En pareja
  fpTagFilter: 'ALL',
  selectedFixedIDs: {},

  // Inicio filters
  taskScope: 'Todas',
  taskTag: 'ALL',
  agendaDate: toInputDate(new Date())
};

let data = null;

function defaultData() {
  try {
    const seedEl = document.getElementById('initial-seed');
    if (seedEl && seedEl.textContent && !seedEl.textContent.includes('__INITIAL_SEED')) {
      return JSON.parse(seedEl.textContent);
    }
  } catch (e) { console.error(e); }
  return {
    name: "Planificador Personal",
    currencyCode: "MXN",
    appearance: "dark",
    weekStartsOn: 2,
    mainAccountName: "T. Débito Santander",
    availableOpeningBalance: 0,
    simulatedIncome: 6200,
    simulatedIncomeMode: "remaining",
    simulatedIncomeScope: "all",
    categories: [],
    accounts: [{ id: uuid(), name: "Efectivo", openingBalance: 0, symbol: "banknote.fill" }],
    debts: [],
    fixedPayments: [],
    entries: [],
    transfers: [],
    budgets: [],
    tasks: [],
    events: [],
    goals: []
  };
}

async function loadData() {
  try {
    const res = await fetch('/api/data');
    if (res.ok) {
      const serverData = await res.json();
      if (serverData && Array.isArray(serverData.categories)) {
        data = serverData;
        normalizeData();
        render();
        return;
      }
    }
  } catch (e) {}
  const local = localStorage.getItem('planificador_personal_data_v1');
  if (local) {
    try { data = JSON.parse(local); } catch (e) { data = defaultData(); }
  } else {
    data = defaultData();
  }
  normalizeData();
  render();
}

function normalizeData() {
  if (!data.categories) data.categories = [];
  if (!data.accounts) data.accounts = [];
  if (!data.accounts.some(a => (a.name || '').trim().toLowerCase() === 'efectivo')) {
    data.accounts.push({ id: uuid(), name: 'Efectivo', openingBalance: 0, symbol: 'banknote.fill' });
  }
  if (!data.debts) data.debts = [];
  if (!data.fixedPayments) data.fixedPayments = [];
  if (!data.entries) data.entries = [];
  if (!data.transfers) data.transfers = [];
  if (!data.budgets) data.budgets = [];
  if (!data.tasks) data.tasks = [];
  if (!data.events) data.events = [];
  if (!data.goals) data.goals = [];
  if (!data.mainAccountName) data.mainAccountName = 'T. Débito Santander';
  if (!data.currencyCode) data.currencyCode = 'MXN';
  if (!data.simulatedIncomeMode) data.simulatedIncomeMode = 'remaining';
  if (!data.simulatedIncomeScope) data.simulatedIncomeScope = 'all';
  document.body.classList.toggle('light-theme', data.appearance === 'light');
}

let saveTimer = null;
function saveData() {
  localStorage.setItem('planificador_personal_data_v1', JSON.stringify(data));
  const statusEl = document.getElementById('save-status');
  if (statusEl) statusEl.textContent = '● Guardando...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    } catch (e) {}
    if (statusEl) statusEl.textContent = '● Guardado automático';
  }, 180);
}

// Formatting & Math Helpers
function fmtMoney(val) {
  const num = Number(val) || 0;
  try {
    return new Intl.NumberFormat('es-MX', {
      style: 'currency',
      currency: data?.currencyCode || 'MXN',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(num);
  } catch (e) {
    return '$' + num.toFixed(2);
  }
}

function fmtDateShort(val) {
  return toDate(val).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtDayMonth(val) {
  return toDate(val).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
}

function monthKey(dateVal = new Date()) {
  const d = toDate(dateVal);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function countsAsExpense(entry) {
  return entry.kind === 'Gasto';
}

function affectsLiquidity(entry) {
  return entry.debtAction !== 'charge';
}

function getMainAccountName() {
  const n = (data.mainAccountName || '').trim();
  return n || 'T. Débito Santander';
}

function isEfectivoAccount(acc) {
  return (acc.name || '').trim().toLowerCase() === 'efectivo';
}

function getEfectivoAccount() {
  return data.accounts.find(isEfectivoAccount);
}

function getBalance(accountID) {
  const base = accountID === null
    ? (Number(data.availableOpeningBalance) || 0)
    : (Number((data.accounts.find(a => a.id === accountID) || {}).openingBalance) || 0);
  const entriesDelta = data.entries
    .filter(e => (e.accountID || null) === accountID && affectsLiquidity(e))
    .reduce((sum, e) => sum + (e.kind === 'Ingreso' ? Number(e.amount) : -Number(e.amount)), 0);
  const outgoing = (data.transfers || [])
    .filter(t => (t.fromAccountID || null) === accountID)
    .reduce((s, t) => s + Number(t.amount), 0);
  const incoming = (data.transfers || [])
    .filter(t => (t.toAccountID || null) === accountID)
    .reduce((s, t) => s + Number(t.amount), 0);
  return base + entriesDelta - outgoing + incoming;
}

function getMainAccountBalance() { return getBalance(null); }
function getEfectivoBalance() {
  const ef = getEfectivoAccount();
  return ef ? getBalance(ef.id) : 0;
}
function getAvailableBalance() {
  return getMainAccountBalance() + getEfectivoBalance();
}
function getBoxesTotal() {
  return data.accounts.filter(a => !isEfectivoAccount(a)).reduce((s, a) => s + getBalance(a.id), 0);
}
function getTotalMoney() {
  return getAvailableBalance() + getBoxesTotal();
}

function getDebtBalance(debt) {
  const charges = data.entries
    .filter(e => e.debtID === debt.id && e.debtAction === 'charge')
    .reduce((s, e) => s + Number(e.amount), 0);
  const payments = data.entries
    .filter(e => e.debtID === debt.id && e.debtAction === 'payment')
    .reduce((s, e) => s + Number(e.amount), 0);
  return (Number(debt.openingBalance) || 0) + charges - payments;
}

function getRunningMainBalances() {
  let running = Number(data.availableOpeningBalance) || 0;
  const events = [];
  for (const e of data.entries) {
    if ((e.accountID || null) === null && affectsLiquidity(e)) {
      events.push({ date: toDate(e.date).getTime(), id: e.id, delta: e.kind === 'Ingreso' ? Number(e.amount) : -Number(e.amount), isEntry: true });
    }
  }
  for (const t of (data.transfers || [])) {
    if ((t.fromAccountID || null) === null) {
      events.push({ date: toDate(t.date).getTime(), id: t.id, delta: -Number(t.amount), isEntry: false });
    } else if ((t.toAccountID || null) === null) {
      events.push({ date: toDate(t.date).getTime(), id: t.id, delta: Number(t.amount), isEntry: false });
    }
  }
  events.sort((a, b) => a.date === b.date ? String(a.id).localeCompare(String(b.id)) : a.date - b.date);
  const result = {};
  for (const ev of events) {
    running += ev.delta;
    if (ev.isEntry) result[ev.id] = running;
  }
  return result;
}

// Fixed Payments Math
const FREQ_META = {
  'Semanal':    { mult: 4,      checks: 4, label: '4 cobros/mes' },
  'Quincenal':  { mult: 2,      checks: 2, label: '2 cobros/mes' },
  'Mensual':    { mult: 1,      checks: 1, label: 'Mensual' },
  'Bimestral':  { mult: 1/2,    checks: 1, label: '÷ 2 meses' },
  'Trimestral': { mult: 1/3,    checks: 1, label: '÷ 3 meses' },
  'Semestral':  { mult: 1/6,    checks: 1, label: '÷ 6 meses' },
  'Anual':      { mult: 1/12,   checks: 1, label: '÷ 12 meses' },
  'Único':      { mult: 1,      checks: 1, label: 'Pago único' }
};

function stepDueDate(ts, freq, dir = 1) {
  const d = toDate(ts);
  if (freq === 'Semanal') d.setDate(d.getDate() + 7 * dir);
  else if (freq === 'Quincenal') d.setDate(d.getDate() + 15 * dir);
  else if (freq === 'Mensual') d.setMonth(d.getMonth() + 1 * dir);
  else if (freq === 'Bimestral') d.setMonth(d.getMonth() + 2 * dir);
  else if (freq === 'Trimestral') d.setMonth(d.getMonth() + 3 * dir);
  else if (freq === 'Semestral') d.setMonth(d.getMonth() + 6 * dir);
  else if (freq === 'Anual') d.setFullYear(d.getFullYear() + 1 * dir);
  return toAppleTimestamp(d);
}

function getEffectiveScope(fp) {
  if (fp.scope === 'En pareja' || fp.scope === 'Personal') return fp.scope;
  const tags = fp.tags || [];
  if (tags.some(t => t.toLowerCase().includes('pareja'))) return 'En pareja';
  return 'Personal';
}

function getTargetChecks(fp) {
  return (FREQ_META[fp.frequency] || FREQ_META['Mensual']).checks;
}

function getCompletedChecks(fp, refDate = new Date()) {
  const key = monthKey(refDate);
  const target = getTargetChecks(fp);
  const manual = (fp.monthlyChecks && fp.monthlyChecks[key]) || 0;
  const recorded = data.entries.filter(e => e.fixedPaymentID === fp.id && monthKey(e.date) === key).length;
  return Math.min(Math.max(manual, recorded), target);
}

function getMonthlyEquivalent(fp) {
  if (!fp.isActive) return 0;
  const amount = Number(fp.amount) || 0;
  if (fp.cycleStart !== undefined && fp.cycleStart !== null) {
    const start = toDate(fp.cycleStart);
    const due = toDate(fp.nextDue);
    const monthsDiff = (due.getFullYear() - start.getFullYear()) * 12 + (due.getMonth() - start.getMonth());
    if (monthsDiff > 1 && ['Mensual', 'Bimestral', 'Trimestral', 'Semestral', 'Anual', 'Único'].includes(fp.frequency)) {
      return amount / monthsDiff;
    }
  }
  const meta = FREQ_META[fp.frequency] || FREQ_META['Mensual'];
  return amount * meta.mult;
}

function getPaidMonthlyFixed(fp) {
  if (!fp.isActive) return 0;
  const monthly = getMonthlyEquivalent(fp);
  const target = Math.max(getTargetChecks(fp), 1);
  const done = getCompletedChecks(fp);
  return monthly * (Number(done) / Number(target));
}

function getRemainingMonthlyFixed(fp) {
  return Math.max(getMonthlyEquivalent(fp) - getPaidMonthlyFixed(fp), 0);
}

function getFixedTotals(scope = null) {
  const list = data.fixedPayments.filter(fp => fp.isActive && (!scope || getEffectiveScope(fp) === scope));
  const monthly = list.reduce((s, fp) => s + getMonthlyEquivalent(fp), 0);
  const paid = list.reduce((s, fp) => s + getPaidMonthlyFixed(fp), 0);
  const remaining = list.reduce((s, fp) => s + getRemainingMonthlyFixed(fp), 0);
  return {
    monthly,
    biweekly: monthly / 2.0,
    weekly: monthly / 4.0,
    paid,
    remaining,
    remainingBiweekly: remaining / 2.0,
    remainingWeekly: remaining / 4.0,
    count: list.length
  };
}

function setMonthlyCheckCount(fpID, newCount, advanceDueDate = true) {
  const fp = data.fixedPayments.find(p => p.id === fpID);
  if (!fp) return;
  const prev = getCompletedChecks(fp);
  const target = getTargetChecks(fp);
  const clamped = Math.min(Math.max(newCount, 0), target);
  if (!fp.monthlyChecks) fp.monthlyChecks = {};
  const key = monthKey();
  if (clamped === 0) delete fp.monthlyChecks[key];
  else fp.monthlyChecks[key] = clamped;

  if (advanceDueDate && fp.frequency !== 'Único') {
    const delta = clamped - prev;
    if (delta > 0) {
      for (let i = 0; i < delta; i++) {
        fp.cycleStart = fp.nextDue;
        fp.nextDue = stepDueDate(fp.nextDue, fp.frequency, 1);
      }
    } else if (delta < 0) {
      for (let i = 0; i < Math.abs(delta); i++) {
        const prevDue = stepDueDate(fp.nextDue, fp.frequency, -1);
        fp.nextDue = prevDue;
        fp.cycleStart = stepDueDate(prevDue, fp.frequency, -1);
      }
    }
  }
  saveData();
  render();
}

function toggleFixedScope(fpID) {
  const fp = data.fixedPayments.find(p => p.id === fpID);
  if (!fp) return;
  fp.scope = getEffectiveScope(fp) === 'Personal' ? 'En pareja' : 'Personal';
  saveData();
  render();
}

// Period Interval Helper
function getPeriodInterval(periodName, customStartStr, customEndStr) {
  const now = new Date();
  const y = state.monthCursor.getFullYear();
  const m = state.monthCursor.getMonth();
  if (periodName === 'Mes actual') {
    return {
      start: new Date(y, m, 1, 0, 0, 0),
      end: new Date(y, m + 1, 1, 0, 0, 0),
      label: state.monthCursor.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })
    };
  }
  if (periodName === 'Mes anterior') {
    const start = new Date(y, m - 1, 1, 0, 0, 0);
    const end = new Date(y, m, 1, 0, 0, 0);
    return { start, end, label: start.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }) };
  }
  if (periodName === 'Últimos 6 meses') {
    const start = new Date(y, m - 5, 1, 0, 0, 0);
    const end = new Date(y, m + 1, 1, 0, 0, 0);
    return { start, end, label: 'Últimos 6 meses' };
  }
  if (periodName === 'Año en curso') {
    return { start: new Date(now.getFullYear(), 0, 1), end: new Date(now.getFullYear() + 1, 0, 1), label: `Año ${now.getFullYear()}` };
  }
  if (periodName === 'Año anterior') {
    const ly = now.getFullYear() - 1;
    return { start: new Date(ly, 0, 1), end: new Date(ly + 1, 0, 1), label: `Año ${ly}` };
  }
  const s = new Date(fromInputDate(customStartStr) * 1000 + APPLE_EPOCH_OFFSET * 1000);
  s.setHours(0,0,0,0);
  const e = new Date(fromInputDate(customEndStr) * 1000 + APPLE_EPOCH_OFFSET * 1000);
  e.setHours(23,59,59,999);
  return { start: s, end: e, label: `${fmtDayMonth(s)} – ${fmtDayMonth(e)}` };
}

function renderCashFlowBreakdown(hoverKind, incTotal, expTotal, incEntries, expEntries) {
  if (!hoverKind) return '';
  const isInc = hoverKind === 'income';
  const list = isInc ? incEntries : expEntries;
  const total = isInc ? incTotal : expTotal;
  const color = isInc ? 'var(--mint)' : 'var(--peach)';
  const byCat = {};
  for (const e of list) byCat[e.categoryID] = (byCat[e.categoryID] || 0) + Number(e.amount);
  const topCats = Object.entries(byCat)
    .map(([id, amt]) => ({ cat: getCategory(id), amt, pct: total > 0 ? Math.round((amt / total) * 100) : 0 }))
    .sort((a, b) => b.amt - a.amt)
    .slice(0, 4);
  const topMovs = [...list].sort((a, b) => Number(b.amount) - Number(a.amount)).slice(0, 3);

  return `
    <div class="chart-dialog" style="border-color:${color};">
      <div class="row-between" style="margin-bottom:8px;">
        <span style="font-weight:800;color:${color};">${isInc ? 'Desglose de Ingresos' : 'Desglose de Gastos'} (${list.length} mov.)</span>
        <span style="font-weight:850;color:${color};">${fmtMoney(total)}</span>
      </div>
      ${topCats.map(c => `
        <div class="row-between" style="font-size:12px;padding:3px 0;">

        </div>
      `).join('')}
      ${topMovs.length > 0 ? `
        <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:11px;color:var(--muted);">

        </div>

function renderDonutSVG(rows, total) {
  const r = 72;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const circles = rows.map(item => {
    const frac = total > 0 ? item.total / total : 0;
    const len = frac * c;
    const isHov = state.catHoverID === item.id;
    const svg = `<circle cx="92" cy="92" r="${r}" fill="transparent" stroke="${item.cat.tint || '#BDA6FF'}"
      stroke-width="${isHov ? 22 : 17}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}"
      style="cursor:pointer;transition:all 0.15s;"
      onmouseenter="state.catHoverID='${item.id}';render();" onmouseleave="state.catHoverID=null;render();" />`;
    offset += len;
    return svg;
  }).join('');
  return `<svg width="184" height="184" viewBox="0 0 184 184" style="transform:rotate(-90deg);">${circles}</svg>`;
}

function renderCategoryHoverDialog(catID, catEntries, catTotal) {
  if (!catID) return '';
  const cat = getCategory(catID);
  const list = catEntries.filter(e => e.categoryID === catID).sort((a, b) => Number(b.amount) - Number(a.amount));
  const total = list.reduce((s, e) => s + Number(e.amount), 0);
  const pct = catTotal > 0 ? Math.round((total / catTotal) * 100) : 0;
  return `
    <div class="chart-dialog" style="border-color:${cat.tint || '#BDA6FF'};">

}

function renderExpenseHeatmapCard() {
  const hInt = getPeriodInterval(state.heatPeriod, state.heatStart, state.heatEnd);
  const expenses = data.entries.filter(e => {
    const d = toDate(e.date);
    return countsAsExpense(e) && d >= hInt.start && d < hInt.end;
  });

  // Group by day YYYY-MM-DD and weekday (0=Lun .. 6=Dom)
  const byDay = {};
  const byDayEntries = {};
  const weekdayTotals = [0, 0, 0, 0, 0, 0, 0];
  const weekdayEntries = [[], [], [], [], [], [], []];
  const weekdayNames = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const weekdayShort = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

  for (const e of expenses) {
    const dKey = toInputDate(e.date);
    byDay[dKey] = (byDay[dKey] || 0) + Number(e.amount);
    if (!byDayEntries[dKey]) byDayEntries[dKey] = [];
    byDayEntries[dKey].push(e);

    const jsDay = toDate(e.date).getDay(); // 0=Dom..6=Sab
    const idx = (jsDay + 6) % 7; // 0=Lun..6=Dom
    weekdayTotals[idx] += Number(e.amount);
    weekdayEntries[idx].push(e);
  }

  let peakWeekdayIdx = 0;
  weekdayTotals.forEach((v, i) => { if (v > weekdayTotals[peakWeekdayIdx]) peakWeekdayIdx = i; });
  const peakDayEntry = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];

  // Calendar grid for the month of hInt.start (or monthCursor)
  const calBase = state.heatPeriod === 'Mes anterior'
    ? new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() - 1, 1)
    : new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth(), 1);
  const year = calBase.getFullYear();
  const month = calBase.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstJsDay = new Date(year, month, 1).getDay();
  const leadingEmpty = (firstJsDay + 6) % 7;
  const maxDayAmt = Math.max(...Object.values(byDay), 1);
  const maxWeekdayAmt = Math.max(...weekdayTotals, 1);

  let calendarCells = '';
  for (let i = 0; i < leadingEmpty; i++) calendarCells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const amt = byDay[key] || 0;
    const ratio = amt > 0 ? Math.min(Math.max(amt / maxDayAmt, 0.18), 1) : 0;
    const bg = amt > 0 ? `rgba(255,184,140,${(0.18 + ratio * 0.68).toFixed(2)})` : 'rgba(30,37,53,0.4)';
    const textCol = ratio > 0.6 ? '#0E1117' : 'var(--text)';
    calendarCells += `
      <div class="heat-cell ${state.heatHoverDay===key?'active':''}" style="background:${bg};color:${textCol};"
           onmouseenter="state.heatHoverDay='${key}';render();" onclick="state.heatHoverDay='${key}';render();">
        <div style="font-size:11px;font-weight:800;">${d}</div>
        ${amt > 0 ? `<div style="font-size:9px;font-weight:700;">$${Math.round(amt)}</div>` : ''}
      </div>
    `;
  }

  return `
    <div class="surface">
      <div class="row-between" style="margin-bottom:10px;">
        <div>
          <div class="h2">Mapa de calor de gastos</div>
          <div class="sub">Descubre en qué días de la semana y fechas del mes gastas más dinero.</div>
        </div>
        <div class="row">
          ${weekdayTotals[peakWeekdayIdx] > 0 ? `<span class="pill pill-peach">🔥 Día que más gastas: ${weekdayNames[peakWeekdayIdx]} (${fmtMoney(weekdayTotals[peakWeekdayIdx])})</span>` : ''}
          ${peakDayEntry ? `<span class="pill">Fecha récord: ${peakDayEntry[0]} (${fmtMoney(peakDayEntry[1])})</span>` : ''}
        </div>
      </div>

      <div class="row-between" style="margin-bottom:12px;">
        ${renderPeriodBar('heat', state.heatPeriod, state.heatStart, state.heatEnd)}
        <div class="seg-bar">
          <button class="seg-btn ${state.heatMode==='calendar'?'active':''}" onclick="state.heatMode='calendar';render();">Calendario día por día</button>
          <button class="seg-btn ${state.heatMode==='weekday'?'active':''}" onclick="state.heatMode='weekday';render();">Por día de la semana (Lun–Dom)</button>
        </div>
      </div>

      ${state.heatMode === 'calendar' ? `
        <div class="heat-grid" style="margin-bottom:6px;">
          ${weekdayShort.map(w => `<div style="text-align:center;font-size:10px;font-weight:800;color:var(--muted);">${w}</div>`).join('')}
        </div>
        <div class="heat-grid">${calendarCells}</div>
        ${state.heatHoverDay && byDay[state.heatHoverDay] ? `
          <div class="chart-dialog" style="border-color:var(--peach);">
            <div class="row-between" style="margin-bottom:4px;">
              <b style="color:var(--peach);">Gastos del ${state.heatHoverDay}</b>
              <b>${fmtMoney(byDay[state.heatHoverDay])}</b>
            </div>
            ${(byDayEntries[state.heatHoverDay] || []).map(e => `
              <div class="row-between" style="font-size:12px;padding:2px 0;">
                <span>${esc(e.title)} · <span class="sub">${esc(getCategory(e.categoryID).name)}</span></span>
                <b>${fmtMoney(e.amount)}</b>
              </div>
            `).join('')}
          </div>
        ` : ''}
      ` : `
        <div style="display:flex;align-items:flex-end;gap:12px;height:210px;padding:16px;background:rgba(14,17,23,0.45);border-radius:16px;border:1px solid var(--line);">
          ${weekdayTotals.map((amt, idx) => `
            <div class="bar-col" style="--glow-color:rgba(255,184,140,0.75);padding:0 4px;"
                 onmouseenter="state.heatHoverWeekday=${idx};render();" onmouseleave="state.heatHoverWeekday=null;render();">
              <div class="bar-top-val" style="font-size:10.5px;color:${idx===peakWeekdayIdx?'var(--peach)':'var(--text)'};">${fmtMoney(amt)}</div>
              <div class="bar-rect" style="height:${Math.max((amt/maxWeekdayAmt)*130, 6)}px;background:${idx===peakWeekdayIdx?'var(--peach)':'var(--lavender)'};"></div>
              <div style="margin-top:7px;font-size:11px;font-weight:700;">${weekdayShort[idx]}</div>
            </div>
          `).join('')}
        </div>
        ${state.heatHoverWeekday !== null ? `
          <div class="chart-dialog" style="border-color:var(--peach);">
            <div class="row-between" style="margin-bottom:4px;">
              <b style="color:var(--peach);">Gastos acumulados en ${weekdayNames[state.heatHoverWeekday]} (${weekdayEntries[state.heatHoverWeekday].length} mov.)</b>
              <b>${fmtMoney(weekdayTotals[state.heatHoverWeekday])}</b>
            </div>
            ${weekdayEntries[state.heatHoverWeekday].sort((a,b)=>Number(b.amount)-Number(a.amount)).slice(0,4).map(e => `
              <div class="row-between" style="font-size:12px;padding:2px 0;">
                <span>${esc(e.title)} (${fmtDayMonth(e.date)})</span>
                <b>${fmtMoney(e.amount)}</b>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `}
    </div>
  `;
}

            <button class="icon-btn" style="width:30px;height:30px;" onclick="deleteFixedPayment('${fp.id}')">🗑</button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function setSimMode(m) {
  data.simulatedIncomeMode = m;
  saveData();
  render();
}
function setSimScope(s) {
  data.simulatedIncomeScope = s;
  saveData();
  render();
}
function onSimIncomeInput(raw) {
  const num = parseFloat(raw);
  data.simulatedIncome = (!isNaN(num) && num > 0) ? num : 0;
  saveData();
  // Update live DOM numbers without losing input focus!
  const mode = data.simulatedIncomeMode || 'remaining';
  const scopeKey = data.simulatedIncomeScope || 'all';
  const simScope = scopeKey === 'personal' ? 'Personal' : scopeKey === 'couple' ? 'En pareja' : null;
  const scoped = getFixedTotals(simScope);
  const deduction = mode === 'total' ? scoped.monthly : mode === 'biweekly' ? scoped.biweekly : mode === 'weekly' ? scoped.weekly : scoped.remaining;
  const simIncome = Number(data.simulatedIncome) || 0;
  const freeAmount = simIncome - deduction;
  const freePct = simIncome > 0 ? Math.round((freeAmount / simIncome) * 100) : 0;
  const valEl = document.getElementById('sim-free-val');
  const lblEl = document.getElementById('sim-free-label');
  const pctEl = document.getElementById('sim-free-pct');
  if (valEl) {
    valEl.textContent = fmtMoney(freeAmount);
    valEl.style.color = freeAmount >= 0 ? 'var(--mint)' : 'var(--peach)';
  }
  if (lblEl) lblEl.textContent = freeAmount >= 0 ? 'TE QUEDA LIBRE' : 'TE FALTA CUBRIR';
  if (pctEl) pctEl.textContent = simIncome > 0 ? `${freePct}% libre` : '';
}

function selectVisibleFixed(ids) {
  const allSelected = ids.every(id => state.selectedFixedIDs[id]);
  ids.forEach(id => {
    if (allSelected) delete state.selectedFixedIDs[id];
    else state.selectedFixedIDs[id] = true;
  });
  render();
}
function selectPendingFixed() {
  state.selectedFixedIDs = {};
  data.fixedPayments.forEach(fp => {
    if (fp.isActive && getRemainingMonthlyFixed(fp) > 0) state.selectedFixedIDs[fp.id] = true;
  });
  render();
}

function renderMovementsCatalog() {
  const runningMap = getRunningMainBalances();
  const mainName = getMainAccountName();

  let list = [...data.entries].sort((a, b) => toDate(b.date) - toDate(a.date));
  if (state.movKind !== 'Todos') list = list.filter(e => e.kind === state.movKind);
  if (state.movCategoryID !== 'ALL') list = list.filter(e => e.categoryID === state.movCategoryID);
  if (state.movSearch.trim()) {
    const q = state.movSearch.trim().toLowerCase();
    list = list.filter(e => (e.title || '').toLowerCase().includes(q) || (e.notes || '').toLowerCase().includes(q));
  }
  if (state.movPeriod !== 'Todo') {
    const now = new Date();
    list = list.filter(e => {
      const d = toDate(e.date);
      if (state.movPeriod === 'Hoy') return toInputDate(d) === toInputDate(now);
      if (state.movPeriod === 'Este mes') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (state.movPeriod === 'Mes pasado') {
        const pm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        return d.getMonth() === pm.getMonth() && d.getFullYear() === pm.getFullYear();
      }
      if (state.movPeriod === 'Personalizado') {
        const dStr = toInputDate(d);
        return dStr >= state.movStart && dStr <= state.movEnd;
      }
      return true;
    });
  }

  return `
    <div class="surface">
      <div class="row-between" style="margin-bottom:14px;">
        <div>
          <div class="h2">Historial de movimientos</div>
          <div class="sub">Incluye la columna Saldo ${esc(mainName)} para ver cuánto sumó o quedó después de cada movimiento.</div>
        </div>
        <input type="text" class="input" style="width:240px;" placeholder="🔍 Buscar concepto o nota..." value="${esc(state.movSearch)}" oninput="state.movSearch=this.value;render();">
      </div>

      <div class="row" style="gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        ${['Todo', 'Hoy', 'Este mes', 'Mes pasado', 'Personalizado'].map(p => `
          <button class="filter-pill ${state.movPeriod===p?'active':''}" onclick="state.movPeriod='${p}';render();">${p}</button>
        `).join('')}
        <span style="margin:0 6px;color:var(--line);">|</span>
        ${['Todos', 'Gasto', 'Ingreso'].map(k => `
          <button class="filter-pill ${state.movKind===k?'active':''}" onclick="state.movKind='${k}';render();">${k === 'Todos' ? 'Todos' : k + 's'}</button>
        `).join('')}
      </div>

      ${state.movPeriod === 'Personalizado' ? `
        <div class="row" style="gap:8px;margin-bottom:12px;">
          <span class="sub">Desde</span>
          <input type="date" class="input" style="width:150px;" value="${state.movStart}" onchange="state.movStart=this.value;render();">
          <span class="sub">Hasta</span>
          <input type="date" class="input" style="width:150px;" value="${state.movEnd}" onchange="state.movEnd=this.value;render();">
        </div>
      ` : ''}

      <div class="row" style="gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;">
        <button class="filter-pill ${state.movCategoryID==='ALL'?'active':''}" onclick="state.movCategoryID='ALL';render();">Todas las categorías</button>
        ${data.categories.filter(c => !c.archived).map(c => `
          <button class="filter-pill ${state.movCategoryID===c.id?'active':''}" onclick="state.movCategoryID='${c.id}';render();">${c.emoji || '•'} ${esc(c.name)}</button>
        `).join('')}
      </div>

      <!-- Header Columns -->
      <div class="row" style="padding:8px 14px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:8px;">
        <div style="flex:2;">MOVIMIENTO</div>
        <div style="flex:1.3;">CATEGORÍA / ORIGEN</div>
        <div style="width:110px;">FECHA</div>
        <div style="width:130px;text-align:right;">IMPORTE</div>
        <div style="width:175px;text-align:right;">SALDO ${esc(mainName.toUpperCase())}</div>
        <div style="width:70px;text-align:right;">ACCIONES</div>
      </div>

      ${list.map(e => {
        const cat = getCategory(e.categoryID);
        const runBal = runningMap[e.id];
        const isExp = e.kind === 'Gasto';
        const accName = e.debtAction === 'charge'
          ? 'Compra a crédito'
          : e.accountID
            ? ((data.accounts.find(a => a.id === e.accountID) || {}).name || 'Caja')
            : mainName;
        return `
          <div class="item-row">
            <div style="flex:2;" class="row">
              <div class="badge-ico" style="background:${cat.tint || '#BDA6FF'}22;color:${cat.tint || '#BDA6FF'};">${cat.emoji || (isExp ? '↗' : '↙')}</div>
              <div>
                <div style="font-weight:750;">${esc(e.title)}</div>
                ${e.notes ? `<div class="sub">${esc(e.notes)}</div>` : ''}
              </div>
            </div>
            <div style="flex:1.3;">
              <div style="font-size:12.5px;font-weight:700;">${esc(cat.name)}</div>
              <div class="sub">${esc(accName)}</div>
            </div>
            <div style="width:110px;font-size:12px;color:var(--muted);">${fmtDateShort(e.date)}</div>
            <div style="width:130px;text-align:right;font-size:15px;font-weight:850;color:${isExp?'var(--peach)':'var(--mint)'};">
              ${isExp ? '−' : '+'}${fmtMoney(e.amount)}

            <div style="width:175px;text-align:right;">
              ${runBal !== undefined ? `

            <div style="width:70px;display:flex;justify-content:flex-end;gap:4px;">
              <button class="icon-btn" style="width:28px;height:28px;font-size:12px;" onclick="openEntryModal('${e.id}')">✎</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:12px;" onclick="deleteEntry('${e.id}')">🗑</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function saveEntryModal(existingID) {
  const title = document.getElementById('en-title').value.trim();
  const amount = parseFloat(document.getElementById('en-amount').value);
  if (!title || isNaN(amount) || amount <= 0) return;
  const entry = {
    id: existingID || uuid(),
    title,
    amount,
    kind: document.getElementById('en-kind').value,
    date: fromInputDate(document.getElementById('en-date').value),
    categoryID: document.getElementById('en-cat').value,
    accountID: document.getElementById('en-acc').value || undefined,
    debtAction: document.getElementById('en-debt-act').value || undefined,
    debtID: document.getElementById('en-debt-id').value || undefined,
    fixedPaymentID: document.getElementById('en-fixed-id').value || undefined,
    notes: document.getElementById('en-notes').value.trim()
  };
  const isNew = !existingID;
  if (existingID) {
    const idx = data.entries.findIndex(e => e.id === existingID);
    if (idx >= 0) data.entries[idx] = entry;
  } else {
    data.entries.push(entry);
  }
  // If linked to a fixed payment and new, auto-check & advance nextDue
  if (isNew && entry.fixedPaymentID) {
    const fp = data.fixedPayments.find(p => p.id === entry.fixedPaymentID);
    if (fp) {
      const done = getCompletedChecks(fp);
      const target = getTargetChecks(fp);
      if (done < target) setMonthlyCheckCount(fp.id, done + 1, true);
      else if (fp.frequency !== 'Único') {
        fp.cycleStart = fp.nextDue;
        fp.nextDue = stepDueDate(fp.nextDue, fp.frequency, 1);
      }
    }
  }
  saveData();
  closeModal();
  render();
}

function deleteEntry(id) {
  data.entries = data.entries.filter(e => e.id !== id);
  saveData();
  render();
}

function saveFixedModal(existingID) {
  const name = document.getElementById('fp-name').value.trim();
  const amount = parseFloat(document.getElementById('fp-amt').value);
  if (!name || isNaN(amount) || amount <= 0) return;
  const tags = document.getElementById('fp-tags').value.split(',').map(s => s.trim()).filter(Boolean);

  const obj = {
    ...(existing || {}),
    id: existingID || uuid(),
    name,
    amount,
    frequency: document.getElementById('fp-freq').value,
    nextDue: fromInputDate(document.getElementById('fp-due').value),
    cycleStart: existing?.cycleStart || toAppleTimestamp(new Date()),
    categoryID: document.getElementById('fp-cat').value,
    scope: document.getElementById('fp-scope').value,
    tags: tags.length ? tags : undefined,
    isActive: true,
    notes: document.getElementById('fp-notes').value.trim()
  };
  if (existingID) {
    const idx = data.fixedPayments.findIndex(p => p.id === existingID);
    if (idx >= 0) data.fixedPayments[idx] = obj;
  } else {
    data.fixedPayments.push(obj);
  }
  saveData();
  closeModal();
  render();

function getBudgetSpent(b) {
  const now = new Date();
  let start = new Date(now.getFullYear(), now.getMonth(), 1);
  let end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  if (b.period === 'Personalizado' && b.start && b.end) {
    start = toDate(b.start);
    end = toDate(b.end);
    end.setHours(23,59,59,999);
  }
  return data.entries.filter(e => {
    const d = toDate(e.date);
    return countsAsExpense(e) && d >= start && d <= end && (!b.categoryID || e.categoryID === b.categoryID);
  }).reduce((s, e) => s + Number(e.amount), 0);
}

// Import / Export JSON
function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planner.json';
  a.click();
}
function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (parsed && Array.isArray(parsed.categories)) {
        data = parsed;
        normalizeData();
        saveData();
        render();
        alert('Base de datos importada correctamente.');
      }
    } catch (e) { alert('Archivo JSON inválido.'); }
  };
  reader.readAsText(file);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
